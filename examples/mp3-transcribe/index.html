<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP3 Transcribe</title>
    <style>
      :root {
        color: #202124;
        background: #f7f8fa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        width: min(980px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .subtle {
        color: #5f6368;
        margin: 0 0 24px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
      }

      select,
      button {
        min-height: 40px;
        border-radius: 6px;
        border: 1px solid #c9ced6;
        background: #ffffff;
        color: #202124;
        font: inherit;
      }

      select {
        padding: 0 12px;
      }

      button {
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        border-color: #166534;
        background: #166534;
        color: #ffffff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }

      section {
        min-width: 0;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }

      pre,
      .segments {
        box-sizing: border-box;
        min-height: 360px;
        max-height: 560px;
        overflow: auto;
        margin: 0;
        border: 1px solid #d9dde3;
        border-radius: 6px;
        background: #ffffff;
        padding: 12px;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .segment {
        padding: 8px 0;
        border-bottom: 1px solid #eef1f4;
      }

      .segment:last-child {
        border-bottom: 0;
      }

      .time {
        color: #5f6368;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MP3 Transcribe</h1>
      <p class="subtle">Uses <code>/Users/soham/audio.mp3</code> from the local dev server.</p>

      <div class="toolbar">
        <select id="model">
          <option value="whisper-tiny">whisper-tiny</option>
          <option value="whisper-base">whisper-base</option>
          <option value="whisper-small">whisper-small</option>
        </select>
        <button id="download" class="primary">Download model</button>
        <button id="transcribe">Transcribe audio.mp3</button>
        <button id="repeat">Download again</button>
      </div>

      <div class="grid">
        <section>
          <h2>Transcript</h2>
          <div id="segments" class="segments"></div>
        </section>
        <section>
          <h2>Events</h2>
          <pre id="log"></pre>
        </section>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
