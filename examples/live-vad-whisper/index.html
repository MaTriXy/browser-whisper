<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live VAD Whisper</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.30/dist/bundle.min.js"></script>
    <style>
      :root {
        color: #1f2933;
        background: #f6f7f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        width: min(1040px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 20px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .status {
        min-width: 138px;
        border: 1px solid #cfd6df;
        border-radius: 6px;
        background: #ffffff;
        padding: 8px 10px;
        color: #52606d;
        font-size: 13px;
        text-align: center;
      }

      .status.speaking {
        border-color: #047857;
        color: #065f46;
        background: #ecfdf5;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      button,
      select {
        min-height: 40px;
        border: 1px solid #c8d0da;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2933;
        font: inherit;
      }

      button {
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        border-color: #155e75;
        background: #155e75;
        color: #ffffff;
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      select {
        padding: 0 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.8fr);
        gap: 16px;
      }

      section {
        min-width: 0;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .transcript,
      pre {
        box-sizing: border-box;
        height: min(68vh, 680px);
        overflow: auto;
        margin: 0;
        border: 1px solid #d8dee6;
        border-radius: 6px;
        background: #ffffff;
        padding: 12px;
      }

      .transcript {
        font-size: 15px;
        line-height: 1.5;
      }

      pre {
        color: #52606d;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      .utterance {
        border-bottom: 1px solid #edf1f5;
        padding: 10px 0;
      }

      .utterance:first-child {
        padding-top: 0;
      }

      .utterance:last-child {
        border-bottom: 0;
      }

      .meta {
        display: block;
        margin-bottom: 4px;
        color: #697586;
        font-size: 12px;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .transcript,
        pre {
          height: 340px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Live VAD Whisper</h1>
        <div id="status" class="status">idle</div>
      </header>

      <div class="toolbar">
        <select id="model">
          <option value="whisper-base" selected>whisper-base (~201 MB)</option>
          <option value="distil-whisper-small">distil-whisper-small (~517 MB)</option>
          <option value="whisper-small">whisper-small (~563 MB)</option>
          <option value="whisper-tiny">whisper-tiny (~118 MB)</option>
          <option value="whisper-large-v3-turbo">whisper-large-v3-turbo (~2.69 GB)</option>
          <option value="whisper-large-v3-turbo_timestamped">whisper-large-v3-turbo_timestamped (~2.69 GB)</option>
          <option value="whisper-large-v3">whisper-large-v3 (~3.12 GB)</option>
          <option value="lite-whisper-large-v3-turbo-fast">lite-whisper-large-v3-turbo-fast (~1.49 GB)</option>
          <option value="lite-whisper-large-v3-turbo">lite-whisper-large-v3-turbo (~1.72 GB)</option>
          <option value="lite-whisper-large-v3-turbo-acc">lite-whisper-large-v3-turbo-acc (~1.89 GB)</option>
          <option value="whisper-small_timestamped">whisper-small_timestamped (~563 MB)</option>
          <option value="whisper-base_timestamped">whisper-base_timestamped (~201 MB)</option>
          <option value="whisper-tiny_timestamped">whisper-tiny_timestamped (~118 MB)</option>
          <option value="moonshine-base">moonshine-base (~96.7 MB)</option>
          <option value="moonshine-tiny">moonshine-tiny (~56.5 MB)</option>
        </select>
        <button id="prepare" class="primary">Prepare</button>
        <button id="start">Start</button>
        <button id="stop" disabled>Stop</button>
        <button id="clear">Clear</button>
      </div>

      <div class="grid">
        <section>
          <h2>Transcript</h2>
          <div id="transcript" class="transcript"></div>
        </section>
        <section>
          <h2>Events</h2>
          <pre id="events"></pre>
        </section>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
